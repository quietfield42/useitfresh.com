<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" aria-labelledby="t d">
  <title id="t">Recipes</title>
  <desc id="d">Ideas, Saved and Plan week along the top, a bar with Quick meals, Use my food and Fits my goals, then Search, Filters, Find recipes and Start again, and the first idea.</desc>
  <rect width="360" height="330" rx="18" fill="#F7F6EF" stroke="#DCE3D2"/>
  <g font-family="Nunito, sans-serif" text-anchor="middle">
    <!-- places -->
    <rect x="16" y="14" width="328" height="48" rx="16" fill="#EEF1E7"/>
    <rect x="20" y="18" width="106" height="40" rx="13" fill="#FFFEF9"/>
    <circle cx="73" cy="31" r="5" fill="none" stroke="#2E7D5B" stroke-width="2"/>
    <text x="73" y="51" font-size="10.5" font-weight="700" fill="#1F2A22">Ideas</text>
    <rect x="175" y="25" width="10" height="12" rx="1.5" fill="none" stroke="#B7791F" stroke-width="2"/>
    <text x="180" y="51" font-size="10.5" font-weight="700" fill="#5B685E">Saved</text>
    <rect x="280" y="25" width="14" height="12" rx="2" fill="none" stroke="#B7791F" stroke-width="2"/>
    <text x="287" y="51" font-size="10.5" font-weight="700" fill="#5B685E">Plan week</text>

    <!-- the bar -->
    <rect x="16" y="70" width="328" height="40" rx="14" fill="#EEF1E7"/>
    <text x="70" y="95" font-size="11" font-weight="700" fill="#1F2A22">Quick meals</text>
    <rect x="126" y="74" width="108" height="32" rx="11" fill="#2E7D5B"/>
    <text x="180" y="95" font-size="11" font-weight="700" fill="#FFFEF9">Use my food</text>
    <text x="289" y="95" font-size="11" font-weight="700" fill="#1F2A22">Fits my goals</text>

    <!-- search and filters -->
    <rect x="16" y="118" width="96" height="34" rx="12" fill="#FFFEF9" stroke="#CAD4BF"/>
    <text x="64" y="140" font-size="11.5" font-weight="700" fill="#07533A">Search</text>
    <rect x="120" y="118" width="96" height="34" rx="12" fill="#FFFEF9" stroke="#CAD4BF"/>
    <text x="168" y="140" font-size="11.5" font-weight="700" fill="#07533A">Filters</text>

    <!-- find, and start again -->
    <rect x="16" y="162" width="270" height="44" rx="16" fill="#2E7D5B"/>
    <text x="151" y="189" font-family="Figtree, sans-serif" font-size="14" font-weight="800" fill="#FFFEF9">Find recipes</text>
    <rect x="294" y="162" width="50" height="44" rx="16" fill="#FFFEF9" stroke="#DCE3D7"/>
    <path d="M311 184a8 8 0 1 0 3-6" fill="none" stroke="#07533A" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M312 172v6h6" fill="none" stroke="#07533A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- the first idea -->
  <rect x="16" y="216" width="328" height="100" rx="18" fill="#FFFEF9" stroke="#DCE3D2"/>
  <rect x="16" y="216" width="328" height="40" rx="18" fill="#E6EDDF"/>
  <rect x="16" y="238" width="328" height="18" fill="#E6EDDF"/>
  <rect x="28" y="226" width="116" height="22" rx="10" fill="#B02585" stroke="#FFFEF9" stroke-width="1.4"/>
  <text x="86" y="241" text-anchor="middle" font-family="Nunito, sans-serif" font-size="9.5" font-weight="900" letter-spacing=".8" fill="#FFFEF9">TONIGHT, SORTED</text>
  <text x="28" y="278" font-family="Figtree, sans-serif" font-size="15" font-weight="800" fill="#1F2A22">Chicken &amp; spinach rice bowl</text>
  <text x="28" y="298" font-family="Nunito, sans-serif" font-size="11" fill="#5B685E">15 min · uses 4 foods in your kitchen</text>
</svg>
