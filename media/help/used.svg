<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" role="img" aria-labelledby="t d">
  <title id="t">What you used</title>
  <desc id="d">Three figures: 19 finished with, 12 used up in green and 7 thrown out in red, with used up chosen, above a chart of eight weeks of bars.</desc>
  <rect width="360" height="290" rx="18" fill="#F7F6EF" stroke="#DCE3D2"/>

  <g font-family="Nunito, sans-serif">
    <rect x="16" y="16" width="102" height="72" rx="16" fill="#FFFEF9" stroke="#DCE3D7"/>
    <text x="30" y="52" font-family="Figtree, sans-serif" font-size="27" font-weight="900" fill="#07533A">19</text>
    <text x="30" y="74" font-size="11" font-weight="700" fill="#5B685E">finished with</text>

    <rect x="129" y="16" width="102" height="72" rx="16" fill="#E9F1E4" stroke="#2E7D5B"/>
    <text x="143" y="52" font-family="Figtree, sans-serif" font-size="27" font-weight="900" fill="#2E7D5B">12</text>
    <text x="143" y="74" font-size="11" font-weight="700" fill="#5B685E">used up</text>

    <rect x="242" y="16" width="102" height="72" rx="16" fill="#FFFEF9" stroke="#DCE3D7"/>
    <text x="256" y="52" font-family="Figtree, sans-serif" font-size="27" font-weight="900" fill="#C0392B">7</text>
    <text x="256" y="74" font-size="11" font-weight="700" fill="#5B685E">thrown out</text>
  </g>

  <text x="16" y="116" font-family="Figtree, sans-serif" font-size="14" font-weight="800" fill="#1F2A22">The last eight weeks</text>
  <!-- bars: used below, thrown above -->
  <g>
    <line x1="16" y1="250" x2="344" y2="250" stroke="#DCE3D2"/>
    <g fill="#2E7D5B">
      <rect x="26" y="214" width="26" height="36" rx="4"/><rect x="66" y="200" width="26" height="50" rx="4"/>
      <rect x="106" y="222" width="26" height="28" rx="4"/><rect x="146" y="190" width="26" height="60" rx="4"/>
      <rect x="186" y="206" width="26" height="44" rx="4"/><rect x="226" y="180" width="26" height="70" rx="4"/>
      <rect x="266" y="196" width="26" height="54" rx="4"/><rect x="306" y="170" width="26" height="80" rx="4"/>
    </g>
    <g fill="#C0392B" opacity=".85">
      <rect x="26" y="196" width="26" height="16" rx="4"/><rect x="66" y="186" width="26" height="12" rx="4"/>
      <rect x="106" y="202" width="26" height="18" rx="4"/><rect x="146" y="180" width="26" height="8" rx="4"/>
      <rect x="186" y="194" width="26" height="10" rx="4"/><rect x="226" y="172" width="26" height="6" rx="4"/>
      <rect x="266" y="186" width="26" height="8" rx="4"/><rect x="306" y="164" width="26" height="4" rx="4"/>
    </g>
  </g>
  <text x="180" y="274" text-anchor="middle" font-family="Nunito, sans-serif" font-size="11" fill="#5B685E">Less thrown out, week by week. Tap a figure to see just those foods.</text>
</svg>
