<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="t d">
  <title id="t">Dates and colours</title>
  <desc id="d">Four rings showing one day left in red, three days in orange, seven days in green and a question mark when a food has no date, with the words printed date and our estimate underneath.</desc>
  <rect width="360" height="300" rx="18" fill="#F7F6EF" stroke="#DCE3D2"/>

  <g font-family="Nunito, sans-serif" text-anchor="middle">
    <!-- 1 day -->
    <g transform="translate(58,86)">
      <circle r="34" fill="none" stroke="#E8ECE0" stroke-width="7"/>
      <path d="M0-34a34 34 0 0 1 8 67" fill="none" stroke="#E0452F" stroke-width="7" stroke-linecap="round"/>
      <text y="1" font-family="Figtree, sans-serif" font-size="21" font-weight="800" fill="#1F2A22">1</text>
      <text y="17" font-size="9" letter-spacing="1" fill="#5B685E">DAY</text>
      <text y="60" font-size="11" font-weight="700" fill="#E0452F">Use me now</text>
    </g>

    <!-- 3 days -->
    <g transform="translate(153,86)">
      <circle r="34" fill="none" stroke="#E8ECE0" stroke-width="7"/>
      <path d="M0-34a34 34 0 0 1 26 55" fill="none" stroke="#FF6A00" stroke-width="7" stroke-linecap="round"/>
      <text y="1" font-family="Figtree, sans-serif" font-size="21" font-weight="800" fill="#1F2A22">3</text>
      <text y="17" font-size="9" letter-spacing="1" fill="#5B685E">DAYS</text>
      <text y="60" font-size="11" font-weight="700" fill="#B7791F">Use first</text>
    </g>

    <!-- 7 days -->
    <g transform="translate(248,86)">
      <circle r="34" fill="none" stroke="#E8ECE0" stroke-width="7"/>
      <path d="M0-34a34 34 0 1 1-30 50" fill="none" stroke="#2E7D5B" stroke-width="7" stroke-linecap="round"/>
      <text y="1" font-family="Figtree, sans-serif" font-size="21" font-weight="800" fill="#1F2A22">7</text>
      <text y="17" font-size="9" letter-spacing="1" fill="#5B685E">DAYS</text>
      <text y="60" font-size="11" font-weight="700" fill="#07533A">Plenty of time</text>
    </g>

    <!-- no date -->
    <g transform="translate(320,86)">
      <circle r="24" fill="none" stroke="#E8ECE0" stroke-width="6"/>
      <text y="9" font-family="Figtree, sans-serif" font-size="26" font-weight="800" fill="#5B685E">?</text>
    </g>
  </g>

  <!-- where the date came from -->
  <g font-family="Nunito, sans-serif">
    <rect x="22" y="182" width="150" height="46" rx="14" fill="#FFFEF9" stroke="#DCE3D2"/>
    <rect x="34" y="196" width="62" height="18" rx="9" fill="#E3EDDD"/>
    <text x="65" y="209" text-anchor="middle" font-size="10" font-weight="700" fill="#07533A">6 days left</text>
    <text x="106" y="209" font-size="11" fill="#5B685E">Printed date</text>

    <rect x="188" y="182" width="150" height="46" rx="14" fill="#FFFEF9" stroke="#DCE3D2"/>
    <rect x="200" y="196" width="74" height="18" rx="9" fill="#FAE7D2"/>
    <text x="237" y="209" text-anchor="middle" font-size="10" font-weight="700" fill="#8A4B12">Use first · 2 days</text>
    <text x="282" y="209" font-size="11" fill="#5B685E">Estimated</text>
  </g>

  <text x="180" y="262" text-anchor="middle" font-family="Nunito, sans-serif" font-size="12" fill="#5B685E">A printed date is taken from the pack. An estimate is ours,</text>
  <text x="180" y="280" text-anchor="middle" font-family="Nunito, sans-serif" font-size="12" fill="#5B685E">and the app always says which it is using.</text>
</svg>
