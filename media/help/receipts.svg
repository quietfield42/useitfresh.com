<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-labelledby="t d">
  <title id="t">Receipts</title>
  <desc id="d">The Receipts screen with a scan button beside the title, Recent, By shop and By day, and a receipt showing the shop, when it was bought, and the count and total in bold.</desc>
  <rect width="360" height="280" rx="18" fill="#F7F6EF" stroke="#DCE3D2"/>

  <text x="20" y="44" font-family="Figtree, sans-serif" font-size="22" font-weight="800" fill="#07533A">Receipts.</text>
  <rect x="296" y="18" width="44" height="44" rx="15" fill="#2E7D5B"/>
  <rect x="308" y="30" width="20" height="20" rx="3" fill="none" stroke="#FFFEF9" stroke-width="2"/>
  <path d="M304 40h28" stroke="#FFFEF9" stroke-width="2" stroke-linecap="round"/>
  <text x="20" y="66" font-family="Nunito, sans-serif" font-size="11.5" fill="#5B685E">3 receipts, shared with your household.</text>

  <g font-family="Nunito, sans-serif" font-weight="800" text-anchor="middle" font-size="11.5">
    <rect x="20" y="80" width="320" height="40" rx="14" fill="#FFFEF9" stroke="#DCE3D2"/>
    <rect x="24" y="84" width="102" height="32" rx="11" fill="#2E7D5B"/>
    <text x="75" y="104" fill="#FFFEF9">Recent</text>
    <text x="180" y="104" fill="#07533A">By shop</text>
    <text x="285" y="104" fill="#07533A">By day</text>
  </g>

  <rect x="20" y="132" width="320" height="128" rx="18" fill="#FFFEF9" stroke="#DCE3D2"/>
  <rect x="34" y="146" width="38" height="38" rx="12" fill="#E3EDDD"/>
  <path d="M46 156h14M46 163h14M46 170h9" stroke="#07533A" stroke-width="2" stroke-linecap="round"/>
  <g font-family="Nunito, sans-serif">
    <text x="84" y="162" font-size="14" font-weight="800" fill="#1F2A22">Greengrocer</text>
    <text x="84" y="180" font-size="11.5" fill="#5B685E">Bought Mon 21 Sep, 5:40 pm</text>
    <text x="84" y="214" font-family="Figtree, sans-serif" font-size="16" font-weight="800" fill="#1F2A22">22 items · $41.02</text>
    <text x="84" y="234" font-size="11" fill="#86927F">Scanned Mon 21 Sep</text>
  </g>
  <path d="M320 160l6 6-6 6" fill="none" stroke="#86927F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
