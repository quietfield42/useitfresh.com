<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" aria-labelledby="t d">
  <title id="t">The shopping list</title>
  <desc id="d">The three stages across the top: shopping list, trolley, kitchen, with the trolley lit. Underneath, list rows with a circle to tick, and the button that puts the trolley away.</desc>
  <rect width="360" height="330" rx="18" fill="#F7F6EF" stroke="#DCE3D2"/>

  <!-- the journey -->
  <rect x="16" y="16" width="328" height="128" rx="20" fill="#FBFAF1" stroke="#E6E8DC"/>
  <g font-family="Nunito, sans-serif" text-anchor="middle">
    <!-- list -->
    <g transform="translate(64,62)">
      <rect x="-17" y="-22" width="34" height="42" rx="6" fill="none" stroke="#86927F" stroke-width="2.4"/>
      <g stroke="#86927F" stroke-width="2.2" stroke-linecap="round">
        <path d="M-9-11h18M-9-2h18M-9 7h10"/>
      </g>
      <text y="42" font-size="12" font-weight="800" fill="#5B685E">Shopping list</text>
    </g>
    <path d="M104 58h22" stroke="#07533A" stroke-width="3" stroke-linecap="round"/>
    <path d="M120 52l8 6-8 6" fill="none" stroke="#07533A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- trolley, lit -->
    <g transform="translate(180,56)">
      <rect x="-56" y="-38" width="112" height="86" rx="18" fill="#E6F0E0"/>
      <g stroke="#07533A" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-34-20h8l7 30h34l8-22h-45"/>
        <circle cx="-14" cy="18" r="4"/>
        <circle cx="12" cy="18" r="4"/>
      </g>
      <rect x="-20" y="-16" width="10" height="16" rx="2" fill="#E8C79A"/>
      <rect x="-7" y="-22" width="8" height="22" rx="3" fill="#9CC48A"/>
      <circle cx="9" cy="-9" r="6" fill="#E0A38B"/>
      <text y="44" font-size="12" font-weight="800" fill="#07533A">Trolley</text>
      <rect x="-56" y="46" width="112" height="3" rx="1.5" fill="#07533A"/>
    </g>
    <path d="M250 58h22" stroke="#07533A" stroke-width="3" stroke-linecap="round"/>
    <path d="M266 52l8 6-8 6" fill="none" stroke="#07533A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- kitchen -->
    <g transform="translate(300,62)">
      <rect x="-16" y="-24" width="32" height="46" rx="6" fill="none" stroke="#86927F" stroke-width="2.4"/>
      <path d="M-16-6h32" stroke="#86927F" stroke-width="2.4"/>
      <path d="M-8-18v7M-8 2v8" stroke="#86927F" stroke-width="2.4" stroke-linecap="round"/>
      <text y="42" font-size="12" font-weight="800" fill="#5B685E">Kitchen</text>
    </g>

    <text x="180" y="122" font-family="Figtree, sans-serif" font-size="15" font-weight="900" fill="#07533A">3 to buy<tspan font-family="Nunito, sans-serif" font-weight="600" fill="#1F2A22">  ·  4 in the trolley</tspan></text>
    <text x="180" y="138" font-size="11" fill="#5B685E">Keep ticking. The trolley fills as you go.</text>
  </g>

  <!-- rows -->
  <g font-family="Nunito, sans-serif">
    <rect x="16" y="158" width="328" height="50" rx="16" fill="#FFFEF9" stroke="#DCE3D2"/>
    <circle cx="44" cy="183" r="11" fill="none" stroke="#86927F" stroke-width="2"/>
    <rect x="64" y="167" width="32" height="32" rx="9" fill="#E3EDDD"/>
    <text x="108" y="188" font-size="13" font-weight="700" fill="#1F2A22">Chicken drumsticks</text>

    <rect x="16" y="216" width="328" height="50" rx="16" fill="#FFFEF9" stroke="#DCE3D2"/>
    <circle cx="44" cy="241" r="11" fill="#2E7D5B"/>
    <path d="M38 241l4 4 8-8" fill="none" stroke="#FFFEF9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="64" y="225" width="32" height="32" rx="9" fill="#E3EDDD"/>
    <text x="108" y="246" font-size="13" font-weight="700" fill="#86927F" text-decoration="line-through">Sourdough loaf</text>
  </g>

  <rect x="16" y="278" width="328" height="40" rx="16" fill="#FFFEF9" stroke="#2E7D5B"/>
  <text x="180" y="303" text-anchor="middle" font-family="Figtree, sans-serif" font-size="13" font-weight="800" fill="#07533A">I have paid · put these in my kitchen</text>
</svg>
