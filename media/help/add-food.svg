<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" role="img" aria-labelledby="t d">
  <title id="t">Adding food</title>
  <desc id="d">The scan screen offers Photo, Shelf, Receipt and Barcode, then a review list where each food found is checked before it is added.</desc>
  <defs>
    <clipPath id="r"><rect x="0" y="0" width="360" height="430" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="360" height="430" fill="#F7F6EF"/>

    <!-- the four ways in -->
    <g>
      <rect x="18" y="18" width="324" height="58" rx="16" fill="#FFFEF9" stroke="#DCE3D2"/>
      <g fill="#07533A" font-family="Nunito, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
        <rect x="24" y="24" width="75" height="46" rx="12" fill="#E3EDDD"/>
        <circle cx="61" cy="41" r="9" fill="none" stroke="#07533A" stroke-width="2"/>
        <text x="61" y="63">Photo</text>

        <rect x="103" y="24" width="75" height="46" rx="12" fill="#2E7D5B"/>
        <rect x="132" y="33" width="18" height="15" rx="3" fill="none" stroke="#FFFEF9" stroke-width="2"/>
        <text x="140" y="63" fill="#FFFEF9">Shelf</text>

        <rect x="182" y="24" width="75" height="46" rx="12" fill="#E3EDDD"/>
        <rect x="211" y="32" width="16" height="18" rx="2" fill="none" stroke="#07533A" stroke-width="2"/>
        <text x="219" y="63">Receipt</text>

        <rect x="261" y="24" width="75" height="46" rx="12" fill="#E3EDDD"/>
        <g stroke="#07533A" stroke-width="2"><path d="M290 33v16M296 33v16M302 33v16M308 33v16"/></g>
        <text x="299" y="63">Barcode</text>
      </g>
    </g>

    <!-- what we found -->
    <text x="18" y="104" font-family="Figtree, sans-serif" font-size="17" font-weight="800" fill="#07533A">Check what we found.</text>
    <text x="18" y="124" font-family="Nunito, sans-serif" font-size="12" fill="#5B685E">6 foods on your shelf.</text>

    <g font-family="Nunito, sans-serif">
      <!-- row 1 -->
      <rect x="18" y="138" width="324" height="58" rx="16" fill="#FFFEF9" stroke="#DCE3D2"/>
      <rect x="28" y="148" width="38" height="38" rx="11" fill="#E0433A" opacity=".18"/>
      <circle cx="47" cy="167" r="11" fill="#E0433A" opacity=".55"/>
      <text x="78" y="162" font-size="13" font-weight="700" fill="#1F2A22">Cherry tomatoes</text>
      <text x="78" y="180" font-size="11" fill="#5B685E">Fridge · 7 days</text>
      <circle cx="320" cy="167" r="13" fill="#E3EDDD"/>
      <path d="M314 167l4 4 8-8" fill="none" stroke="#07533A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- row 2 -->
      <rect x="18" y="204" width="324" height="58" rx="16" fill="#FFFEF9" stroke="#DCE3D2"/>
      <rect x="28" y="214" width="38" height="38" rx="11" fill="#E8C79A" opacity=".5"/>
      <rect x="40" y="222" width="14" height="22" rx="3" fill="#C49A5C" opacity=".7"/>
      <text x="78" y="228" font-size="13" font-weight="700" fill="#1F2A22">Greek yogurt</text>
      <text x="78" y="246" font-size="11" fill="#5B685E">Fridge · printed 28 Sep</text>
      <circle cx="320" cy="233" r="13" fill="#E3EDDD"/>
      <path d="M314 233l4 4 8-8" fill="none" stroke="#07533A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- row 3 -->
      <rect x="18" y="270" width="324" height="58" rx="16" fill="#FFFEF9" stroke="#DCE3D2"/>
      <rect x="28" y="280" width="38" height="38" rx="11" fill="#83BD43" opacity=".3"/>
      <path d="M36 308c8-16 18-20 22-22-2 8-6 18-22 22z" fill="#83BD43" opacity=".8"/>
      <text x="78" y="294" font-size="13" font-weight="700" fill="#1F2A22">Baby spinach</text>
      <text x="78" y="312" font-size="11" fill="#5B685E">Fridge · 4 days</text>
      <circle cx="320" cy="299" r="13" fill="#FFFEF9" stroke="#DCE3D2"/>
      <path d="M315 294l10 10M325 294l-10 10" stroke="#B42318" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- the one button -->
    <rect x="18" y="346" width="324" height="52" rx="18" fill="#2E7D5B"/>
    <text x="180" y="378" text-anchor="middle" font-family="Figtree, sans-serif" font-size="15" font-weight="800" fill="#FFFEF9">Add 2 foods to my kitchen</text>
    <text x="180" y="416" text-anchor="middle" font-family="Nunito, sans-serif" font-size="11" fill="#86927F">Nothing is added until you say so.</text>
  </g>
  <rect x="0.5" y="0.5" width="359" height="429" rx="18" fill="none" stroke="#DCE3D2"/>
</svg>
