<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="t d">
  <title id="t">Tonight</title>
  <desc id="d">Three dinners built from food that needs using, one chosen, with who is cooking, who is eating, and the buttons for cooking it or saving a plate.</desc>
  <rect width="360" height="300" rx="18" fill="#F7F6EF" stroke="#DCE3D2"/>

  <!-- the chosen dinner -->
  <rect x="16" y="16" width="328" height="150" rx="20" fill="#FFFEF9" stroke="#DCE3D2"/>
  <rect x="16" y="16" width="328" height="66" rx="20" fill="#E6EDDF"/>
  <rect x="16" y="60" width="328" height="22" fill="#E6EDDF"/>

  <!-- the magenta tag -->
  <rect x="30" y="30" width="96" height="26" rx="11" fill="#B02585" stroke="#FFFEF9" stroke-width="1.6"/>
  <text x="78" y="47" text-anchor="middle" font-family="Nunito, sans-serif" font-size="10" font-weight="900" letter-spacing="1" fill="#FFFEF9">TONIGHT</text>
  <text x="328" y="47" text-anchor="end" font-family="Nunito, sans-serif" font-size="12" font-weight="700" fill="#07533A">Change</text>

  <text x="30" y="104" font-family="Figtree, sans-serif" font-size="16" font-weight="800" fill="#1F2A22">Tomato &amp; spinach pasta</text>
  <text x="30" y="124" font-family="Nunito, sans-serif" font-size="11" fill="#5B685E">Sam is cooking · 2 eating · all in your kitchen</text>

  <rect x="30" y="134" width="180" height="20" rx="10" fill="#E3EDDD"/>
  <text x="120" y="148" text-anchor="middle" font-family="Nunito, sans-serif" font-size="10" font-weight="700" fill="#07533A">Uses spinach, tomatoes, spaghetti</text>

  <!-- the two things you do -->
  <rect x="16" y="180" width="328" height="46" rx="18" fill="#2E7D5B"/>
  <path d="M66 198l5 5 9-9" fill="none" stroke="#FFFEF9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="200" y="208" text-anchor="middle" font-family="Figtree, sans-serif" font-size="14" font-weight="800" fill="#FFFEF9">I cooked and ate this</text>

  <rect x="16" y="234" width="328" height="44" rx="18" fill="#FFFEF9" stroke="#DCE3D2"/>
  <circle cx="52" cy="256" r="10" fill="none" stroke="#B02585" stroke-width="2"/>
  <path d="M52 250v6l4 3" fill="none" stroke="#B02585" stroke-width="2" stroke-linecap="round"/>
  <text x="202" y="261" text-anchor="middle" font-family="Figtree, sans-serif" font-size="12.5" font-weight="800" fill="#B02585">Eating later? Save me a plate</text>
</svg>
