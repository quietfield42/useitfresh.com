<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset your password — Use It Fresh</title>
<meta name="robots" content="noindex">
<link rel="icon" href="symbol-color.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@700;800&family=Nunito:wght@400;600;700&display=swap">
<style>
  /* A password reset link lands here and is handed to the app, which asks for
     the new password (owner, 19 Sep 2026). No keys, nothing stored. */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: #0c100e; color: #202c24; font-family: Nunito, "Segoe UI", Helvetica, Arial, sans-serif;
         display: flex; align-items: center; justify-content: center; padding-inline: 16px; padding-block: 24px;
         background-image: url("intro/fridge-closed.jpg"); background-size: cover; background-position: center; }
  .card { width: 100%; max-width: 380px; background: rgba(247, 247, 240, 0.9); border: 1px solid rgba(255, 255, 255, 0.6);
          border-radius: 24px; padding: 28px 22px 22px; text-align: center; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35); }
  .card img { width: 170px; height: auto; display: block; margin: 0 auto 16px; }
  h1 { font-family: Figtree, "Segoe UI", sans-serif; font-weight: 800; font-size: 24px; line-height: 1.2; color: #07533a; margin: 0 0 10px; text-wrap: balance; }
  p { margin: 0 0 18px; font-size: 16px; line-height: 1.5; color: #3d4a41; }
  a.button { display: inline-block; background: #07533a; color: #fff; text-decoration: none; font-weight: 700; font-size: 17px;
             padding: 14px 26px; border-radius: 16px; border-bottom: 3px solid #033c29; }
  a.button:focus-visible { outline: 3px solid #8fd1a7; outline-offset: 3px; }
  small { display: block; margin-top: 16px; font-size: 13px; line-height: 1.45; color: #59665d; }
</style>
</head>
<body>
<main class="card">
  <img src="horizontal-color.svg" alt="Use It Fresh">
  <h1>Choose a new password</h1>
  <p>Tap below and Use It Fresh will open, ready for your new password.</p>
  <a class="button" id="open" href="useitfresh://useitfresh.com/update-password">Open the app</a>
  <small id="hint">This link only works on the phone with Use It Fresh installed.
    If you are reading this on a computer, open the same email on your phone.</small>
</main>
<script>
  // Hand the whole link (the one-time code after ? or #) to the app.
  //
  // This page used to jump straight at the app with location.replace. On a
  // phone with the app installed that is seamless; anywhere else — a laptop, a
  // phone without the app, a reviewer's emulator — the jump fails and leaves a
  // blank window, so password recovery looked broken to everybody who opened
  // their email on a computer (found 28 Sep 2026).
  //
  // Now the page always renders, and only a phone is sent onward.
  (function () {
    var target = "useitfresh://useitfresh.com/update-password" +
      window.location.search + window.location.hash;
    document.getElementById("open").setAttribute("href", target);

    var onPhone = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (!onPhone) return;

    // Leave the page up. If the app is there it takes over; if it is not,
    // the reader still has something to read and a button to press.
    setTimeout(function () { window.location.href = target; }, 400);
  })();
</script>
</body>
</html>
