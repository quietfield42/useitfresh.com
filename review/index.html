<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07533a">
<meta name="robots" content="noindex,nofollow">
<title>Marketing Portal · Use It Fresh</title>
<link rel="stylesheet" href="portal.css?v=1">
</head>
<body>
<header class="top">
  <img src="assets/logo.svg" alt="Use It Fresh" class="logo">
  <span class="top-title">Marketing portal</span>
  </header>

<main>
  <div id="app">
    <p id="mc-status" class="mc-status" role="status">Checking Metricool…</p>

    <nav class="tabs" role="tablist" aria-label="Social accounts" id="tabs"></nav>

    <section class="card upload" id="composer" aria-labelledby="composer-title">
      <h2 id="composer-title"></h2>

      <label class="drop" id="drop">
        <input type="file" id="file" accept="image/jpeg,image/png,image/webp,image/*,video/mp4,video/quicktime">
        <span class="drop-plus">＋</span>
        <span class="drop-main">Upload a picture or video</span>
        <span class="drop-sub" id="drop-sub"></span>
      </label>

      <div id="preview" class="preview" hidden>
        <div class="preview-media" id="preview-media"></div>
        <div class="preview-info">
          <p id="preview-note"></p>
          <div class="bar" id="bar" hidden><i id="bar-fill"></i></div>
          <button type="button" class="link" id="change-file">Choose a different file</button>
        </div>
      </div>

      <div id="type-row" class="row" hidden>
        <span class="row-label">Post as</span>
        <div class="seg" role="group" aria-label="Post type">
          <button type="button" data-type="post" aria-pressed="true">Feed post</button>
          <button type="button" data-type="story" aria-pressed="false">Story</button>
        </div>
      </div>

      <label id="title-row" hidden>YouTube title<input id="title" maxlength="100" placeholder="Short title for the video"></label>
      <label>Caption<textarea id="caption" rows="5" maxlength="5000" placeholder="Write the caption, hashtags included"></textarea>
        <small id="caption-count" class="count"></small></label>

      <div class="row">
        <span class="row-label">Also post to</span>
        <div class="chips" id="also"></div>
      </div>

      <div class="row when">
        <span class="row-label">When (Sydney time)</span>
        <input type="date" id="date" aria-label="Date">
        <input type="time" id="time" aria-label="Time" step="300">
        <button type="button" class="chip" data-quick="8">Next 8 am</button>
        <button type="button" class="chip" data-quick="20">Next 8 pm</button>
      </div>

      <button type="button" class="big send" id="send">Send to Metricool</button>
      <output id="send-msg" class="msg" aria-live="polite"></output>
    </section>

    <section class="card">
      <h2 id="list-title">Sent from here</h2>
      <div id="list" class="list"><p class="muted">Nothing yet.</p></div>
    </section>
  </div>
</main>

<footer>Use It Fresh marketing portal · Uploads go straight to Metricool and post at the time you pick.</footer>
<script src="config.js"></script>
<script src="portal.js?v=2"></script>
</body>
</html>
